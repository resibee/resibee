<!DOCTYPE html>
<html>
<head>
    <title>ResiBee</title>

    https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
        }

        h1 {
            color: #f4b400;
        }

        .calendar-box {
            margin-top: 30px;
        }

        input {
            padding: 12px;
            width: 250px;
            font-size: 16px;
        }

        .legend {
            margin-top: 20px;
        }

        .legend span {
            margin: 0 10px;
        }
    </style>
</head>

<body>

    <h1>🐝 ResiBee</h1>

    <h2>Know Availability Before You Book</h2>

    <p>Select your dates below.</p>

    <div class="calendar-box">
        <input id="datepicker" placeholder="Select a date">
    </div>

    <div class="legend">
        <span>🟢 Available</span>
        <span>🔴 Booked</span>
    </div>

    /flatpickr"></script>

    <script>
        flatpickr("#datepicker", {
            inline: true
        });
    </script>

</body>
</html>
